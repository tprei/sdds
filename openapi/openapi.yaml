openapi: 3.0.3
info:
  title: sdds API
  version: 0.0.0
  description: HTTP JSON contract for the sdds API.
  license:
    name: UNLICENSED
    url: https://spdx.org/licenses/UNLICENSED.html
servers:
  - url: /
    description: Active API origin
security: []
tags:
  - name: Operations
    description: Runtime health endpoints.
  - name: Catalog
    description: Backend-owned category catalog.
  - name: Auth
    description: User account and session endpoints.
  - name: Authors
    description: Public author profile endpoints.
  - name: Notes
    description: Text-first recommendation notes.
  - name: Reports
    description: Authenticated report intake endpoints.
paths:
  /v1/media/images/{image_id}:
    get:
      operationId: GetMediaImage
      summary: Serve an attached image
      security: []
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested image bytes.
          headers:
            Content-Length:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: The image ID is not a canonical UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The image is not attached to a note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The attached image failed integrity checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Media storage is temporarily unavailable.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/media/image-uploads:
    post:
      operationId: PrepareImageUpload
      summary: Stage one private image upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PrepareImageUploadMultipart"
      responses:
        "201":
          description: Image staged and ready for association.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadReceipt"
        "400":
          description: Invalid multipart structure or image metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Upload identity conflict, in-progress retry, or expired identity.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Encoded image or multipart body exceeds the limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Staged-upload quota exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The media could not be persisted due to an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Media storage is temporarily unavailable.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags:
        - Operations
      responses:
        "204":
          description: The API process is running.
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check API readiness
      tags:
        - Operations
      responses:
        "204":
          description: The API can serve traffic.
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The API cannot serve traffic because a required dependency is unavailable.
  /v1/categories:
    get:
      operationId: listCategories
      summary: List category catalog
      tags:
        - Catalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Category catalog rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCategoriesResponse"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not list categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/users:
    post:
      operationId: createAuthUser
      summary: Create a user account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The user was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: The request JSON or auth fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many signup requests are in flight or recently attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/sessions:
    post:
      operationId: createAuthSession
      summary: Create an authenticated session
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The credentials were exchanged for a session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: The request JSON or auth fields are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login requests are in flight or recently attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/email:
    put:
      operationId: setAuthEmail
      summary: Set or change the current user's contact email
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserEmailRequest"
      responses:
        "202":
          description: The address was accepted and a verification message will be dispatched.
        "400":
          description: The email is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not store the address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Transactional email delivery is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Get the current authenticated session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponse"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not get the current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAuthSession
      summary: Delete the current authenticated session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The session was revoked.
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not revoke the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/authors/{author_id}:
    get:
      operationId: getAuthor
      summary: Get a public author profile
      tags:
        - Authors
      security:
        - bearerAuth: []
      parameters:
        - name: author_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public author profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuthor"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The author was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not get the author.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/authors/{author_id}/notes:
    get:
      operationId: listAuthorNotes
      summary: List an author's notes
      tags:
        - Authors
      security:
        - bearerAuth: []
      parameters:
        - name: author_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Optional page size. Defaults to 20 and must be between 1 and 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the preceding author-notes page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: A page of the author's notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorNotesPage"
        "400":
          description: The request parameters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The author was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not list the author's notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notes:
    get:
      operationId: listNotes
      summary: List recent notes
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: category_slug
          in: query
          required: false
          description: Optional active category slug used to narrow recent notes.
          schema:
            $ref: "#/components/schemas/CategorySlug"
      responses:
        "200":
          description: Recent notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNotesResponse"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not list notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNote
      summary: Create a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: The note was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The request JSON or note content is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The note request or image association conflicts with an existing request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The image association or the embedding runtime is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notes/{note_id}:
    get:
      operationId: getNote
      summary: Get a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not get the note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNote
      summary: Update a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The request does not match the API contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not the note author.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The embedding runtime is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not update the note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNote
      summary: Delete a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The note was deleted.
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not the note author.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not delete the note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notes/{note_id}/comments:
    get:
      operationId: listNoteComments
      summary: List note comments
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: An oldest-first page of comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListNoteCommentsResponse"
        "400":
          description: Invalid comment pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not list note comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNoteComment
      summary: Create a note comment
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid JSON or comment body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 8 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notes/{note_id}/comments/{comment_id}:
    delete:
      operationId: deleteNoteComment
      summary: Delete a note comment
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
        - name: comment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The comment was deleted.
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The authenticated user is not the comment author.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note or comment was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not delete the comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/comments/{comment_id}/replies:
    post:
      operationId: createCommentReply
      summary: Reply to a top-level note comment
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: comment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: The created reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid JSON or reply body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The parent comment or its note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The parent comment is itself a reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 8 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notes/{note_id}/useful:
    put:
      operationId: markNoteUseful
      summary: Mark a note as useful
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The note was marked useful.
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not mark the note useful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unmarkNoteUseful
      summary: Remove a useful mark from a note
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The useful mark was removed.
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The note was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not remove the useful mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/search/notes:
    get:
      operationId: searchNotes
      summary: Search notes
      tags:
        - Notes
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Raw user search text. Missing, blank, or overlong values return invalid_search.
          schema:
            type: string
        - name: category_slug
          in: query
          required: false
          description: Optional active category slug used to narrow search results.
          schema:
            $ref: "#/components/schemas/CategorySlug"
      responses:
        "200":
          description: Matching notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchNotesResponse"
        "400":
          description: The search query is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not search notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The embedding runtime is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/reports:
    post:
      operationId: createReport
      summary: Create a report
      tags:
        - Reports
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: The report was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "200":
          description: An existing report for this reporter and target was overwritten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          description: Invalid JSON or report fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The reported target was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 8 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The API could not create the report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/events:
    post:
      operationId: createEvents
      summary: Record product events
      tags:
        - Operations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventsRequest"
      responses:
        "200":
          description: Events accepted or already stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventsReceipt"
        "400":
          description: Invalid JSON, event batch, or indexed event.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EventErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The request is missing a valid authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The request body exceeds 256 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The event rate limit was exceeded.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The event batch could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - expires_at
        - user
      properties:
        token:
          type: string
        expires_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in milliseconds.
        user:
          $ref: "#/components/schemas/CurrentUser"
    AuthorSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
      properties:
        id:
          type: string
        display_name:
          type: string
    PublicAuthor:
      type: object
      additionalProperties: false
      required: [id, display_name, note_count, useful_received_count]
      properties:
        id:
          type: string
        display_name:
          type: string
        note_count:
          type: integer
          format: int64
          minimum: 0
        useful_received_count:
          type: integer
          format: int64
          minimum: 0
    AuthorNotesPage:
      type: object
      additionalProperties: false
      required: [notes, next_cursor]
      properties:
        notes:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        next_cursor:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
    CategorySlug:
      type: string
    CatalogCategory:
      type: object
      additionalProperties: false
      required:
        - slug
        - label
        - active
        - display_order
      properties:
        slug:
          $ref: "#/components/schemas/CategorySlug"
        label:
          type: string
        active:
          type: boolean
        display_order:
          type: integer
          format: int32
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - body
        - author
        - created_at
        - parent_comment_id
      properties:
        id:
          type: string
        body:
          type: string
          minLength: 1
          maxLength: 1000
        author:
          $ref: "#/components/schemas/AuthorSummary"
        created_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in milliseconds.
        parent_comment_id:
          type: string
          nullable: true
    CommentThread:
      type: object
      additionalProperties: false
      required:
        - comment
        - replies
        - has_more_replies
      properties:
        comment:
          $ref: "#/components/schemas/Comment"
        replies:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Comment"
        has_more_replies:
          type: boolean
    ImageUploadReceipt:
      type: object
      additionalProperties: false
      required:
        - image_upload_id
        - content_type
        - byte_size
        - width
        - height
        - expires_at
      properties:
        image_upload_id:
          type: string
          format: uuid
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
        byte_size:
          type: integer
          format: int64
          minimum: 1
        width:
          type: integer
          format: int32
          minimum: 1
        height:
          type: integer
          format: int32
          minimum: 1
        expires_at:
          type: integer
          format: int64
          minimum: 1
    PrepareImageUploadMultipart:
      type: object
      additionalProperties: false
      required:
        - upload_request_id
        - file
      properties:
        upload_request_id:
          type: string
          format: uuid
          maxLength: 128
        file:
          type: string
          format: binary
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
    CreateReportRequest:
      type: object
      additionalProperties: false
      required:
        - target_type
        - target_id
        - reason
      properties:
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          maxLength: 1000
    ReportReceipt:
      type: object
      additionalProperties: false
      required:
        - id
        - target_type
        - target_id
        - reason
        - details
        - created_at
      properties:
        id:
          type: string
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          type: string
        reason:
          $ref: "#/components/schemas/ReportReason"
        details:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in milliseconds of the first report for this reporter and target.
    ReportReason:
      type: string
      enum:
        - spam
        - harassment
        - harmful_or_misleading
        - other
    ReportTargetType:
      type: string
      enum:
        - note
        - comment
    CreateNoteRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - body
        - category_slug
        - client_request_id
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000
        category_slug:
          $ref: "#/components/schemas/CategorySlug"
        client_request_id:
          type: string
          minLength: 1
          maxLength: 128
        image_upload_ids:
          type: array
          uniqueItems: true
          maxItems: 1
          items:
            type: string
    UpdateNoteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000
        category_slug:
          $ref: "#/components/schemas/CategorySlug"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - display_name
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
        email:
          type: string
          maxLength: 254
          description: Optional contact address collected at signup and verified out of band.
    UserEmail:
      type: object
      additionalProperties: false
      required:
        - address
        - verified
      properties:
        address:
          type: string
        verified:
          type: boolean
    SetUserEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          maxLength: 254
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required:
        - expires_at
        - user
      properties:
        expires_at:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in milliseconds.
        user:
          $ref: "#/components/schemas/CurrentUser"
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - author
      properties:
        id:
          type: string
        username:
          type: string
        author:
          $ref: "#/components/schemas/AuthorSummary"
        email:
          $ref: "#/components/schemas/UserEmail"
    ErrorCode:
      type: string
      x-enum-varnames:
        - ErrorCodeInternal
        - ErrorCodeForbidden
        - ErrorCodeInvalidAuth
        - ErrorCodeInvalidComment
        - ErrorCodeInvalidJSON
        - ErrorCodeInvalidNote
        - ErrorCodeInvalidReport
        - ErrorCodeInvalidSearch
        - ErrorCodeNotFound
        - ErrorCodeRateLimited
        - ErrorCodeRequestTooLarge
        - ErrorCodeUnauthenticated
        - ErrorCodeUsernameTaken
        - ErrorCodeInvalidMedia
        - ErrorCodeUnsupportedMediaType
        - ErrorCodeIdempotencyConflict
        - ErrorCodeUploadInProgress
        - ErrorCodeUploadExpired
        - ErrorCodeMediaStagingQuotaExceeded
        - ErrorCodeMediaStorageUnavailable
        - ErrorCodeMediaIntegrityError
        - ErrorCodeTooManyImages
        - ErrorCodeInvalidEvent
        - ErrorCodeInvalidEventBatch
        - ErrorCodeEmbeddingUnavailable
        - ErrorCodeInvalidReplyTarget
        - ErrorCodeInvalidEmail
        - ErrorCodeMailUnavailable
      enum:
        - internal_error
        - forbidden
        - invalid_auth
        - invalid_comment
        - invalid_json
        - invalid_note
        - invalid_report
        - invalid_search
        - not_found
        - rate_limited
        - request_too_large
        - unauthenticated
        - username_taken
        - invalid_media
        - unsupported_media_type
        - idempotency_conflict
        - upload_in_progress
        - upload_expired
        - media_staging_quota_exceeded
        - media_storage_unavailable
        - media_integrity_error
        - too_many_images
        - invalid_event
        - invalid_event_batch
        - embedding_unavailable
        - invalid_reply_target
        - invalid_email
        - mail_unavailable
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ValidationProblem"
    EventID:
      type: string
      format: uuid
    EventPlatform:
      type: string
      enum: [ios, android, web]
    SearchVersion:
      type: string
      enum: [fts5-v1, hybrid-serafim100m-fts5-v1]
    RetrievalSource:
      type: string
      enum: [lexical, semantic, hybrid]
    EventAppVersion:
      type: string
      minLength: 1
      maxLength: 64
    EventOccurredAt:
      type: integer
      format: int64
      minimum: 1
      maximum: 253402300799999
    EventRank:
      type: integer
      minimum: 1
      maximum: 50
    EventResultCount:
      type: integer
      minimum: 0
      maximum: 50
    EventQuery:
      type: string
      minLength: 1
      maxLength: 120
    EventExploreResult:
      type: object
      additionalProperties: false
      required: [note_id, rank]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        rank:
          $ref: "#/components/schemas/EventRank"
    EventSearchResult:
      type: object
      additionalProperties: false
      required: [note_id, rank, retrieval_source]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        rank:
          $ref: "#/components/schemas/EventRank"
        retrieval_source:
          $ref: "#/components/schemas/RetrievalSource"
    EventExploreNotesImpressionPayload:
      type: object
      additionalProperties: false
      required: [category_slug, result_count, results]
      properties:
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
        result_count:
          $ref: "#/components/schemas/EventResultCount"
        results:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/EventExploreResult"
    EventExploreNoteOpenedPayload:
      type: object
      additionalProperties: false
      required: [note_id, rank, category_slug]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        rank:
          $ref: "#/components/schemas/EventRank"
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
    EventSearchSubmittedPayload:
      type: object
      additionalProperties: false
      required: [search_id, search_version, query, category_slug]
      properties:
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        query:
          $ref: "#/components/schemas/EventQuery"
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
    EventSearchResultsImpressionPayload:
      type: object
      additionalProperties: false
      required: [search_id, search_version, query, category_slug, result_count, results]
      properties:
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        query:
          $ref: "#/components/schemas/EventQuery"
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
        result_count:
          $ref: "#/components/schemas/EventResultCount"
        results:
          type: array
          minItems: 0
          maxItems: 50
          items:
            $ref: "#/components/schemas/EventSearchResult"
    EventSearchResultOpenedPayload:
      type: object
      additionalProperties: false
      required: [search_id, search_version, note_id, rank, retrieval_source]
      properties:
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        note_id:
          $ref: "#/components/schemas/EventID"
        rank:
          $ref: "#/components/schemas/EventRank"
        retrieval_source:
          $ref: "#/components/schemas/RetrievalSource"
    EventSearchReformulatedPayload:
      type: object
      additionalProperties: false
      required: [previous_search_id, previous_search_version, search_id, search_version, previous_query, query, previous_category_slug, category_slug]
      properties:
        previous_search_id:
          $ref: "#/components/schemas/EventID"
        previous_search_version:
          $ref: "#/components/schemas/SearchVersion"
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        previous_query:
          $ref: "#/components/schemas/EventQuery"
        query:
          $ref: "#/components/schemas/EventQuery"
        previous_category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
    EventSearchNoResultsPayload:
      type: object
      additionalProperties: false
      required: [search_id, search_version, query, category_slug, result_count]
      properties:
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        query:
          $ref: "#/components/schemas/EventQuery"
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
        result_count:
          type: integer
          enum: [0]
    EventSearchUsefulContext:
      type: object
      additionalProperties: false
      required: [source, search_id, search_version, rank, retrieval_source]
      properties:
        source:
          type: string
          enum: [search]
        search_id:
          $ref: "#/components/schemas/EventID"
        search_version:
          $ref: "#/components/schemas/SearchVersion"
        rank:
          $ref: "#/components/schemas/EventRank"
        retrieval_source:
          $ref: "#/components/schemas/RetrievalSource"
    EventExploreUsefulContext:
      type: object
      additionalProperties: false
      required: [source, rank, category_slug]
      properties:
        source:
          type: string
          enum: [explore]
        rank:
          $ref: "#/components/schemas/EventRank"
        category_slug:
          type: string
          allOf:
            - $ref: "#/components/schemas/CategorySlug"
          nullable: true
    EventNoteDetailUsefulContext:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          enum: [note_detail]
    EventAuthorProfileUsefulContext:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          type: string
          enum: [author_profile]
    EventUsefulContext:
      oneOf:
        - $ref: "#/components/schemas/EventSearchUsefulContext"
        - $ref: "#/components/schemas/EventExploreUsefulContext"
        - $ref: "#/components/schemas/EventNoteDetailUsefulContext"
        - $ref: "#/components/schemas/EventAuthorProfileUsefulContext"
      discriminator:
        propertyName: source
        mapping:
          search: "#/components/schemas/EventSearchUsefulContext"
          explore: "#/components/schemas/EventExploreUsefulContext"
          note_detail: "#/components/schemas/EventNoteDetailUsefulContext"
          author_profile: "#/components/schemas/EventAuthorProfileUsefulContext"
    EventUsefulPayload:
      type: object
      additionalProperties: false
      required: [note_id, context]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        context:
          $ref: "#/components/schemas/EventUsefulContext"
    EventCommentCreatedPayload:
      type: object
      additionalProperties: false
      required: [note_id, comment_id]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        comment_id:
          $ref: "#/components/schemas/EventID"
        parent_comment_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/EventID"
          nullable: true
    EventReportCreatedPayload:
      type: object
      additionalProperties: false
      required: [report_id, target_type, target_id]
      properties:
        report_id:
          $ref: "#/components/schemas/EventID"
        target_type:
          $ref: "#/components/schemas/ReportTargetType"
        target_id:
          $ref: "#/components/schemas/EventID"
    EventNotePublishedPayload:
      type: object
      additionalProperties: false
      required: [note_id, category_slug]
      properties:
        note_id:
          $ref: "#/components/schemas/EventID"
        category_slug:
          $ref: "#/components/schemas/CategorySlug"
    EventExploreNotesImpression:
      type: object
      additionalProperties: false
      required: [id, kind, occurred_at, installation_id, platform, app_version, schema_version, payload]
      properties:
        id:
          $ref: "#/components/schemas/EventID"
        kind:
          type: string
          enum: [explore_notes_impression]
        occurred_at:
          $ref: "#/components/schemas/EventOccurredAt"
        installation_id:
          type: string
          allOf:
            - $ref: "#/components/schemas/EventID"
          nullable: true
        platform:
          $ref: "#/components/schemas/EventPlatform"
        app_version:
          type: string
          allOf:
            - $ref: "#/components/schemas/EventAppVersion"
          nullable: true
        schema_version:
          type: integer
          enum: [1]
        payload:
          $ref: "#/components/schemas/EventExploreNotesImpressionPayload"
    EventExploreNoteOpened:
      type: object
      additionalProperties: false
      required: [id, kind, occurred_at, installation_id, platform, app_version, schema_version, payload]
      properties:
        id:
          $ref: "#/components/schemas/EventID"
        kind:
          type: string
          enum: [explore_note_opened]
        occurred_at:
          $ref: "#/components/schemas/EventOccurredAt"
        installation_id:
