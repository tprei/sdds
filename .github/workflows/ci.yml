name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint Go
        run: |
          files=$(gofmt -l services/api tests/integration)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
          go tool golangci-lint run ./services/api/... ./tests/integration

      - name: Test API
        run: go test ./services/api/...

  api-docker-integration:
    name: API Docker Integration
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run API integration smoke
        env:
          SDDS_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-logs
        run: pnpm smoke api

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 14
          if-no-files-found: ignore

  rustfs-integration:
    name: RustFS Integration
    runs-on: ubuntu-latest
    needs: api-docker-integration
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run RustFS integration smoke
        env:
          SDDS_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-logs
        run: pnpm smoke rustfs

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 14
          if-no-files-found: ignore

  mobile:
    name: Mobile And Tokens
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI and TypeScript
        run: pnpm openapi:lint && pnpm lint:ts

      - name: Check mobile API schemas
        run: pnpm api:schema:check

      - name: Check generated Go API contract
        run: pnpm openapi:check:go

      - name: Typecheck tokens
        run: pnpm typecheck:tokens

      - name: Typecheck synthetics
        run: pnpm typecheck:synthetics

      - name: Test mobile
        run: pnpm test:mobile

      - name: Test wire contracts
        run: pnpm test:contract

  embedding:
    name: Embedding Sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and test embedding image
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:services/embedding"
          target: test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

