version = 1

[worker]
memory_mb = 4096
max = 1

[setup]
inputs = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/mobile/package.json",
  "packages/tokens/package.json",
  "go.mod",
  "go.sum",
]
run = [
  "npm i -g --prefix $HOME/.local pnpm@11.5.2",
  "sudo ln -sfn $HOME/.local/bin/pnpm /usr/local/bin/pnpm",
  "pnpm install --frozen-lockfile",
  "go mod download",
  "GOTOOLCHAIN=go1.26.2 go build -o /tmp/ github.com/golangci/golangci-lint/v2/cmd/golangci-lint github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen",
]

# off syncs the tree without .git, but the openapi checks run git ls-files and git diff,
# so the check builds an index from the synced files first.
[tasks.check]
run = "git init -q && git add -A && pnpm check"
timeout = "30m"
env = { GOTOOLCHAIN = "go1.26.2" }

[tasks.test]
run = "pnpm test:api && pnpm test:mobile && pnpm test:contract"
timeout = "20m"
env = { GOTOOLCHAIN = "go1.26.2" }
