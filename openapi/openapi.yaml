      type: object
      additionalProperties: false
      required:
        - id
        - url
        - content_type
        - byte_size
        - width
        - height
        - position
        - created_at
        - updated_at
      properties:
        id:
          type: string
        url:
          type: string
          minLength: 1
          format: uri-reference
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
        byte_size:
          type: integer
          format: int64
          minimum: 1
        width:
          type: integer
          format: int32
          minimum: 1
        height:
          type: integer
          format: int32
          minimum: 1
        position:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    Note:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - body
        - category_slug
        - author
        - created_at
        - updated_at
        - images
        - useful_count
        - useful_by_current_user
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        category_slug:
          $ref: "#/components/schemas/CategorySlug"
        author:
          $ref: "#/components/schemas/AuthorSummary"
        created_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        updated_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        images:
          type: array
          items:
            $ref: "#/components/schemas/NoteImage"
        useful_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of users who marked this note useful.
        useful_by_current_user:
          type: boolean
          description: Whether the current authenticated user marked this note useful.
    ValidationField:
      type: string
      x-enum-varnames:
        - ValidationFieldTitle
        - ValidationFieldBody
        - ValidationFieldCategorySlug
        - ValidationFieldQ
        - ValidationFieldUsername
        - ValidationFieldPassword
        - ValidationFieldDisplayName
        - ValidationFieldLimit
        - ValidationFieldCursor
        - ValidationFieldClientRequestID
        - ValidationFieldUploadRequestID
        - ValidationFieldImageUploadIDs
        - ValidationFieldFile
        - ValidationFieldTargetType
        - ValidationFieldTargetID
        - ValidationFieldReason
        - ValidationFieldDetails
        - ValidationFieldParentCommentID
        - ValidationFieldEmail
      enum:
        - title
        - body
        - category_slug
        - q
        - username
        - password
        - display_name
        - limit
        - cursor
        - client_request_id
        - upload_request_id
        - image_upload_ids
        - file
        - target_type
        - target_id
        - reason
        - details
        - parent_comment_id
        - email
    ValidationProblem:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          $ref: "#/components/schemas/ValidationField"
        code:
          type: string
          x-enum-varnames:
            - ValidationProblemCodeRequired
            - ValidationProblemCodeTooShort
            - ValidationProblemCodeTooLong
            - ValidationProblemCodeUnknown
            - ValidationProblemCodeInvalid
            - ValidationProblemCodeTaken
          enum:
            - required
            - too_short
            - too_long
            - unknown
            - invalid
            - taken
